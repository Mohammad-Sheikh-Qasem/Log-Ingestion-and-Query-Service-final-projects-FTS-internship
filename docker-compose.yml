services:
  app:
    build: .
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 256m
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgres@db:5432/logs_db
      - NODE_OPTIONS=--max-old-space-size=192
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: logs_db
    cpus: "1.0"
    mem_limit: 1g
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logs_db
    command: >
      postgres
      -c wal_level=minimal
      -c max_wal_senders=0
      -c wal_buffers=16MB
      -c max_wal_size=2GB
      -c checkpoint_timeout=15min
      -c autovacuum_naptime=10s
      -c autovacuum_vacuum_scale_factor=0.05
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c synchronous_commit=off
      -c fsync=off
      -c full_page_writes=off
      -c checkpoint_completion_target=0.9
      -c max_connections=100
      -c statement_timeout=60000
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logs_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:


